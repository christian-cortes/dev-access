services:
  ingress:
    image: nginx:stable
    container_name: access_nginx
    restart: unless-stopped
    # Límite de memoria: este host tiene ~3,3 GB y las copias al NAS ya compiten por
    # ella; sin tope, un contenedor puede empujar el swap al 100% y colgar el resto.
    mem_limit: 96m
    # host network: nginx bindea 80/443 directamente y alcanza Pi-hole (8443)
    # y Netdata por 127.0.0.1 en ubuntu-services.
    network_mode: host
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./portal:/var/www/portal:ro
      - ./backupcsr/web/static:/var/www/backupcsr:ro

  portal-api:
    build: ./backend
    image: cortexdev-portal-api:local
    container_name: portal_api
    restart: unless-stopped
    mem_limit: 192m
    # host network + bind a 127.0.0.1: nginx lo proxifica en index.cortexdev.win/api/
    network_mode: host
    command: uvicorn app.main:app --host 127.0.0.1 --port 8088
    environment:
      DB_PATH: /data/portal.db
      CATALOG_PATH: /app/catalog.yml
      POLL_INTERVAL: "30"
      PROBE_TIMEOUT: "5"
      RETENTION_DAYS: "7"
      # Publicación de eventos (servicio caído/recuperado) al servicio de notificaciones.
      NOTIFY_URL: "http://127.0.0.1:8490"
      NOTIFY_INGEST_TOKEN: ${NOTIFY_INGEST_TOKEN:-}
    volumes:
      - ./backend/data:/data
      - ./certs:/certs:ro
      # host network ignora "dns:", así que se monta un resolv.conf con el DNS
      # de la LAN primero; si no, los *.cortexdev.win no resuelven y todo sale offline.
      - ./backend/resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  portal-build:
    build: ./backend
    profiles: ["build"]
    environment:
      PYTHONPATH: /app
    volumes:
      - ./scripts:/scripts:ro
      - ./portal:/portal
      - ./backend/catalog.yml:/catalog.yml:ro
    command: python /scripts/build-portal.py --catalog /catalog.yml --templates /portal/templates --out /portal/dist

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 384m
    # host network: alcanza el Netdata de los 4 hosts (:19999) y bindea a 127.0.0.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: grafana
    restart: unless-stopped
    mem_limit: 384m
    # host network + bind a 127.0.0.1: nginx lo proxifica en grafana.cortexdev.win
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: https://grafana.cortexdev.win
      GF_SERVER_DOMAIN: grafana.cortexdev.win
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?define GF_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  notify:
    container_name: notify
    mem_limit: 192m
    build:
      context: ./notify
      dockerfile: Dockerfile
    image: cortexdev-notify:local
    # host network: uvicorn bindea 127.0.0.1:8490; las apps lo alcanzan y nginx
    # lo usa para auth_request y el proxy /api/push.
    network_mode: host
    environment:
      NOTIFY_DB_PATH: /data/notify.db
      # Mismo secreto/salt/cookie que backupcsr/web/app/auth.py para el SSO.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_COOKIE: ${AUTH_COOKIE:-backupcsr_session}
      AUTH_SALT: ${AUTH_SALT:-backupcsr-session}
      # Credenciales generales del login único (index.cortexdev.win). Sustituyen
      # al login propio de copias: la misma sesión entra en copias, ups, etc.
      AUTH_GENERAL_USER: ${AUTH_GENERAL_USER:-}
      AUTH_GENERAL_PASSWORD: ${AUTH_GENERAL_PASSWORD:-}
      AUTH_GENERAL_ROLE: ${AUTH_GENERAL_ROLE:-admin}
      NOTIFY_LOGIN_URL: ${NOTIFY_LOGIN_URL:-https://index.cortexdev.win/login.html}
      NOTIFY_INGEST_TOKEN: ${NOTIFY_INGEST_TOKEN:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: /etc/firebase/service-account.json
      NOTIFY_MAIL_TO: ${NOTIFY_MAIL_TO:-}
      BACKUP_ALERT_MAIL_TO: ${BACKUP_ALERT_MAIL_TO:-}
      BACKUP_ALERT_SMTP_HOST: ${BACKUP_ALERT_SMTP_HOST:-}
      BACKUP_ALERT_SMTP_PORT: ${BACKUP_ALERT_SMTP_PORT:-}
      BACKUP_ALERT_SMTP_USER: ${BACKUP_ALERT_SMTP_USER:-}
      BACKUP_ALERT_SMTP_PASS: ${BACKUP_ALERT_SMTP_PASS:-}
      BACKUP_ALERT_SMTP_TLS: ${BACKUP_ALERT_SMTP_TLS:-}
    volumes:
      - ./notify/data:/data
      # Cuenta de servicio de Firebase (gitignored). Se monta FUERA de /data a
      # propósito: un file-mount dentro del bind de un directorio es frágil y
      # puede quedar tapado por el montaje del directorio (FCM quedaría off).
      - ./firebase-service-account.json:/etc/firebase/service-account.json:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8490/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ups_app:
    container_name: ups_app
    mem_limit: 128m
    build:
      context: ./ups
      dockerfile: Dockerfile
    # host network: uvicorn bindea 127.0.0.1:8484 y alcanza portal-api (127.0.0.1:8088).
    network_mode: host
    environment:
      UPS_HOST: "192.168.0.224"
      UPS_NAME: "apc"
      POLL_INTERVAL: "30"
      DB_PATH: "/data/ups.db"
      SIMULATE: "0"
      HTTP_FALLBACK: "1"
      PORTAL_STATUS_URL: "http://127.0.0.1:8088/api/status"
      # Precio de la energia para estimar el costo del consumo mensual (0 lo oculta).
      ENERGY_PRICE_PER_KWH: "970.82"
      ENERGY_CURRENCY: "COP"
      # Publicación de eventos al servicio de notificaciones.
      NOTIFY_URL: "http://127.0.0.1:8490"
      NOTIFY_INGEST_TOKEN: ${NOTIFY_INGEST_TOKEN:-}
    volumes:
      - ./ups/data:/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8484/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
