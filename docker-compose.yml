services:
  ingress:
    image: nginx:stable
    container_name: access_nginx
    restart: unless-stopped
    # Límite de memoria: este host tiene ~3,3 GB y las copias al NAS ya compiten por
    # ella; sin tope, un contenedor puede empujar el swap al 100% y colgar el resto.
    mem_limit: 96m
    # host network: nginx bindea 80/443 directamente y alcanza Pi-hole (8443)
    # y Netdata/Uptime por 127.0.0.1 en ubuntu-services.
    network_mode: host
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./portal:/var/www/portal:ro
      - ./backupcsr/web/static:/var/www/backupcsr:ro

  portal-api:
    build: ./backend
    image: cortexdev-portal-api:local
    container_name: portal_api
    restart: unless-stopped
    mem_limit: 192m
    # host network + bind a 127.0.0.1: nginx lo proxifica en index.cortexdev.win/api/
    network_mode: host
    command: uvicorn app.main:app --host 127.0.0.1 --port 8088
    environment:
      DB_PATH: /data/portal.db
      CATALOG_PATH: /app/catalog.yml
      POLL_INTERVAL: "30"
      PROBE_TIMEOUT: "5"
      RETENTION_DAYS: "7"
    volumes:
      - ./backend/data:/data
      - ./certs:/certs:ro
      # host network ignora "dns:", así que se monta un resolv.conf con el DNS
      # de la LAN primero; si no, los *.cortexdev.win no resuelven y todo sale offline.
      - ./backend/resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 384m
    # host network: alcanza el Netdata de los 4 hosts (:19999) y bindea a 127.0.0.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: grafana
    restart: unless-stopped
    mem_limit: 384m
    # host network + bind a 127.0.0.1: nginx lo proxifica en grafana.cortexdev.win
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: https://grafana.cortexdev.win
      GF_SERVER_DOMAIN: grafana.cortexdev.win
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?define GF_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  ups_app:
    container_name: ups_app
    mem_limit: 128m
    build:
      context: ./ups
      dockerfile: Dockerfile
    # host network: uvicorn bindea 127.0.0.1:8484 y alcanza portal-api (127.0.0.1:8088).
    network_mode: host
    environment:
      UPS_HOST: "192.168.0.224"
      UPS_NAME: "apc"
      POLL_INTERVAL: "30"
      DB_PATH: "/data/ups.db"
      SIMULATE: "0"
      HTTP_FALLBACK: "1"
      PORTAL_STATUS_URL: "http://127.0.0.1:8088/api/status"
      # Precio de la energia para estimar el costo del consumo mensual (0 lo oculta).
      ENERGY_PRICE_PER_KWH: "970.82"
      ENERGY_CURRENCY: "COP"
    volumes:
      - ./ups/data:/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8484/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
