<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicons/cortexdev-32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/favicons/cortexdev-180.png">
	<title>CortexDev · Acceso</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.5rem;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1120 60%);
			color: #e2e8f0;
		}
		.card {
			width: 100%;
			max-width: 380px;
			background: rgba(15, 23, 42, .92);
			border: 1px solid #1e293b;
			border-radius: 16px;
			padding: 2rem;
			box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
		}
		.brand { display: flex; align-items: center; gap: .85rem; margin-bottom: 1.5rem; }
		.brand .dot {
			width: 42px; height: 42px; border-radius: 12px; flex: none;
			background: linear-gradient(135deg, #38bdf8, #6366f1);
			display: grid; place-items: center;
			font-weight: 700; font-size: 1.05rem; color: #04121f;
		}
		.brand h1 { margin: 0; font-size: 1.15rem; }
		.brand p { margin: .15rem 0 0; font-size: .8rem; color: #94a3b8; }
		label { display: block; font-size: .82rem; color: #cbd5e1; margin: 0 0 .35rem; }
		input {
			width: 100%;
			padding: .65rem .75rem;
			margin-bottom: 1rem;
			border-radius: 10px;
			border: 1px solid #334155;
			background: #0b1120;
			color: #e2e8f0;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #38bdf8; border-color: #38bdf8; }
		button {
			width: 100%;
			padding: .7rem;
			border: 0;
			border-radius: 10px;
			background: linear-gradient(135deg, #38bdf8, #6366f1);
			color: #04121f;
			font-weight: 600;
			font-size: 1rem;
			cursor: pointer;
		}
		button:disabled { opacity: .6; cursor: default; }
		.error {
			display: none;
			margin: 0 0 1rem;
			padding: .6rem .75rem;
			border-radius: 10px;
			background: rgba(248, 113, 113, .14);
			border: 1px solid rgba(248, 113, 113, .4);
			color: #fca5a5;
			font-size: .85rem;
		}
		.foot { margin-top: 1.25rem; text-align: center; font-size: .76rem; color: #64748b; }
	</style>
</head>

<body>
	<div class="card">
		<div class="brand">
			<div class="dot">CD</div>
			<div>
				<h1>CortexDev · Acceso</h1>
				<p>index.cortexdev.win</p>
			</div>
		</div>

		<div class="error" id="login-error"></div>

		<form id="login-form">
			<label for="username">Usuario</label>
			<input id="username" autocomplete="username" required autofocus>
			<label for="password">Contraseña</label>
			<input type="password" id="password" autocomplete="current-password" required>
			<button type="submit" id="login-submit">Entrar</button>
		</form>

		<p class="foot">Acceso restringido · ubuntu-services</p>
	</div>

	<script>
		(function () {
			'use strict';
			var form = document.getElementById('login-form');
			var errorBox = document.getElementById('login-error');
			var submit = document.getElementById('login-submit');

			/* El destino tras entrar lo decide el backend: nginx guarda la página
			   de origen en la cookie cortex_sso_next y /api/auth/login responde
			   con `next` ya validado. La URL del login queda limpia. */

			/* Si ya hay sesión válida, no mostrar el formulario. */
			fetch('/api/auth/me', { credentials: 'same-origin' })
				.then(function (res) { if (res.ok) location.replace('/'); })
				.catch(function () {});

			form.addEventListener('submit', async function (event) {
				event.preventDefault();
				errorBox.style.display = 'none';
				submit.disabled = true;
				try {
					var res = await fetch('/api/auth/login', {
						method: 'POST',
						credentials: 'same-origin',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							username: document.getElementById('username').value,
							password: document.getElementById('password').value
						})
					});
					var text = await res.text();
					var data = null;
					try { data = text ? JSON.parse(text) : null; } catch (e) {}
					if (!res.ok) {
						throw new Error((data && data.detail) || ('HTTP ' + res.status));
					}
					location.href = (data && data.next) || '/';
				} catch (err) {
					errorBox.textContent = 'No se pudo entrar: ' + err.message;
					errorBox.style.display = 'block';
					submit.disabled = false;
				}
			});
		})();
	</script>
</body>

</html>
