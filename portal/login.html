<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicons/cortexdev-32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/favicons/cortexdev-180.png">
	<title>CortexDev · Acceso</title>
	<!-- Página pública (sin sesión): el CSS/JS externo está tras SSO, así que la
	     apariencia va inline con los tokens del sistema (design_portainer.md). -->
	<style>
		:root {
			color-scheme: dark;
			--mgr-bg: #202124;
			--mgr-surface: #26272b;
			--mgr-border: #3b3d44;
			--mgr-text: #eff1f4;
			--mgr-muted: #98a2b3;
			--mgr-primary: #0086c9;
			--mgr-primary-strong: #0ba5ec;
			--mgr-danger: #f97066;
			--mgr-radius: 8px;
			--mgr-radius-lg: 10px;
			--mgr-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -20px rgba(0, 0, 0, .8);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 13.5px;
			line-height: 1.5;
			background: var(--mgr-bg);
			color: var(--mgr-text);
		}

		.login-card {
			width: 100%;
			max-width: 400px;
			padding: 1.75rem;
			background: var(--mgr-surface);
			border: 1px solid var(--mgr-border);
			border-radius: var(--mgr-radius-lg);
			box-shadow: var(--mgr-shadow);
		}

		.login-brand {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 1.25rem;
		}

		.login-brand .logo {
			width: 42px;
			height: 42px;
			flex: 0 0 auto;
			border-radius: var(--mgr-radius);
			overflow: hidden;
		}

		.login-brand .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
		.login-brand h1 { margin: 0; font-size: 1.1rem; }
		.login-brand p { margin: .15rem 0 0; font-size: .8rem; color: var(--mgr-muted); }

		label { display: block; font-size: .82rem; color: var(--mgr-muted); margin: 0 0 .35rem; }

		input {
			width: 100%;
			padding: .6rem .75rem;
			margin-bottom: 1rem;
			border-radius: var(--mgr-radius);
			border: 1px solid var(--mgr-border);
			background: var(--mgr-bg);
			color: var(--mgr-text);
			font-size: 1rem;
		}

		input:focus {
			outline: 2px solid var(--mgr-primary);
			border-color: var(--mgr-primary);
		}

		button {
			width: 100%;
			padding: .65rem;
			border: 0;
			border-radius: var(--mgr-radius);
			background: var(--mgr-primary);
			color: #ffffff;
			font-weight: 600;
			font-size: 1rem;
			cursor: pointer;
		}

		button:hover { background: var(--mgr-primary-strong); }
		button:disabled { opacity: .6; cursor: default; }

		.login-error {
			display: none;
			margin: 0 0 1rem;
			padding: .6rem .75rem;
			border-radius: var(--mgr-radius);
			background: rgba(249, 112, 102, .14);
			border: 1px solid rgba(249, 112, 102, .4);
			color: var(--mgr-danger);
			font-size: .85rem;
		}

		.login-foot { margin-top: 1.25rem; text-align: center; font-size: .76rem; color: var(--mgr-muted); }
	</style>
</head>

<body>
	<div class="login-card">
		<div class="login-brand">
			<div class="logo"><img src="/favicons/cortexdev-180.png" alt="CortexDev" width="42" height="42"></div>
			<div>
				<h1>CortexDev · Acceso</h1>
				<p>index.cortexdev.win</p>
			</div>
		</div>

		<div class="login-error" id="login-error"></div>

		<form id="login-form">
			<label for="username">Usuario</label>
			<input id="username" autocomplete="username" required autofocus>
			<label for="password">Contraseña</label>
			<input type="password" id="password" autocomplete="current-password" required>
			<button type="submit" id="login-submit">Entrar</button>
		</form>

		<p class="login-foot">Acceso restringido · ubuntu-services</p>
	</div>

	<script>
		(function () {
			'use strict';
			var form = document.getElementById('login-form');
			var errorBox = document.getElementById('login-error');
			var submit = document.getElementById('login-submit');

			/* El destino tras entrar lo decide el backend: nginx guarda la página
			   de origen en la cookie cortex_sso_next y /api/auth/login responde
			   con `next` ya validado. La URL del login queda limpia. */

			/* Si ya hay sesión válida, no mostrar el formulario. */
			fetch('/api/auth/me', { credentials: 'same-origin' })
				.then(function (res) { if (res.ok) location.replace('/'); })
				.catch(function () { });

			form.addEventListener('submit', async function (event) {
				event.preventDefault();
				errorBox.style.display = 'none';
				submit.disabled = true;
				try {
					var res = await fetch('/api/auth/login', {
						method: 'POST',
						credentials: 'same-origin',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							username: document.getElementById('username').value,
							password: document.getElementById('password').value
						})
					});
					var text = await res.text();
					var data = null;
					try { data = text ? JSON.parse(text) : null; } catch (e) { }
					if (!res.ok) {
						throw new Error((data && data.detail) || ('HTTP ' + res.status));
					}
					location.href = (data && data.next) || '/';
				} catch (err) {
					errorBox.textContent = 'No se pudo entrar: ' + err.message;
					errorBox.style.display = 'block';
					submit.disabled = false;
				}
			});
		})();
	</script>
</body>

</html>
