# ---------------------------------------------------------------------------
# Detección de navegaciones de documento (contexto http).
#
# El `auth_request` devuelve 401 tanto a la página como a sus subrecursos
# (favicon, JS, CSS, imágenes...). El bloque @sso_login de cada vhost guardaba
# SIEMPRE el destino del login en `cortex_sso_next`, así que la petición del
# favicon (que hace el navegador en la página de login) sobrescribía el destino
# real y el login acababa redirigiendo a /favicon.ico (o a un .js/.css).
#
# `$sso_is_document` vale 1 solo para navegaciones top-level con Accept text/html:
# esas sí recuerdan el destino; el resto recibe un 401 limpio sin tocar la cookie.
# ---------------------------------------------------------------------------

# Sec-Fetch-Dest identifica el tipo de recurso; los subrecursos no son "document".
map $http_sec_fetch_dest $sso_dest_ok {
    default 1;
    "~*^(image|script|style|font|audio|video|track|manifest|worker|embed|object|empty)$" 0;
}

# Navegaciones (y navegadores antiguos sin Sec-Fetch-*) mandan Accept text/html.
map $http_accept $sso_accept_html {
    default 0;
    "~*text/html" 1;
}

map "$sso_dest_ok$sso_accept_html" $sso_is_document {
    default 0;
    "11" 1;
}
