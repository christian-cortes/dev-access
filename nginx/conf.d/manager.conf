# ---------------------------------------------------------------------------
# cortexdev-manager — panel en .49 (proxya al contenedor manager_nginx, 127.0.0.1:8090)
#
# El login ya no vive aquí: es único en index.cortexdev.win (servicio notify). La
# sesión llega por la cookie firmada Domain=.cortexdev.win, que se valida con
# `auth_request` contra notify. El usuario autenticado se propaga a la app en la
# cabecera X-Auth-User (el backend la mapea a un usuario local).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name manager.cortexdev.win manager.cortexdev.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name manager.cortexdev.win manager.cortexdev.lan;

    include /etc/nginx/conf.d/snippets/tls-win.conf;

    client_max_body_size 20M;

    # --- SSO: valida la cookie firmada compartida contra el servicio notify ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8490/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location @sso_login {
        # Solo las navegaciones de documento recuerdan el destino; los
        # subrecursos (favicon, JS, CSS, fetch...) devuelven 401 sin tocar la
        # cookie (evita que el login acabe en /favicon.ico o en un .js).
        if ($sso_is_document) {
            add_header Set-Cookie "cortex_sso_next=$scheme://$host$uri; Domain=.cortexdev.win; Path=/; Max-Age=300; Secure; SameSite=Lax";
            return 302 https://index.cortexdev.win/login.html;
        }
        return 401;
    }

    # Login propio eliminado: cualquier enlace viejo va al login central.
    location = /login {
        return 302 https://index.cortexdev.win/login.html;
    }

    # Login/logout/me central (servicio notify): emite/borra la cookie firmada con
    # Domain=.cortexdev.win para todos los sitios.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Notificaciones (servicio notify). El área "manager" se configura aquí ---
    location /api/push/ {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Ingesta interna de eventos (el gestor publica aquí, notify valida token) ---
    # Solo desde la red interna del host; el contenedor del gestor llega a través
    # del gateway de su bridge (extra_hosts host-gateway). Nunca desde Internet.
    location = /_notify/events {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8490/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker de FCM: DEBE servirse público (sin SSO y sin redirecciones);
    # un SW con login o con redirect falla el registro (redirect mode = "error").
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check público: lo consulta portal-api (probe del catálogo). Sin SSO,
    # si no devolvería 302 y el monitor marcaría el gestor como caído.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8090/up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Favicon/iconos: públicos (el navegador los pide sin sesión).
    location = /favicon.ico {
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /favicon.png {
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /_auth;
        auth_request_set $sso_user $upstream_http_x_auth_user;
        error_page 401 = @sso_login;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El proxy REESCRIBE la cabecera: un cliente no puede falsificar el usuario.
        proxy_set_header X-Auth-User $sso_user;
        proxy_read_timeout 1800;
    }

    location ~ /\.ht { deny all; }
}
