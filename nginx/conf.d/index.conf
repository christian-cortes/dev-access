# ---------------------------------------------------------------------------
# Portal / indice interno (index.cortexdev.win) — capa de acceso en ubuntu-services
#
# DNS: Pi-hole resuelve index.cortexdev.win -> 192.168.0.49 (override sobre el
# wildcard *.cortexdev.win, que apunta las apps a 192.168.0.87).
# TLS: wildcard publico de Let's Encrypt (tls-win.conf).
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name index.cortexdev.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name index.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/index-body.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    http2 on;
}
