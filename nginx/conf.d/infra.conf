# ---------------------------------------------------------------------------
# Dashboards de infraestructura — capa de acceso en ubuntu-services
#
# Sirve pihole, proxmox, backups/pbs, grafana y netdata-* desde
# 192.168.0.49 para que sigan accesibles aunque ubuntu-docker este apagado.
# Pi-hole escucha en 127.0.0.1:8443 (su UI se movio de 443 a 8443 en el host).
#
# TLS: wildcard publico de Let's Encrypt (tls-win.conf); un server block .win
# por servicio. El cuerpo de cada uno se comparte via snippets/.
# ---------------------------------------------------------------------------

# Redireccion HTTP -> HTTPS de los dashboards
server {
    listen 80;
    server_name pihole.cortexdev.win proxmox.cortexdev.win backups.cortexdev.win pbs.cortexdev.win grafana.cortexdev.win netdata-services.cortexdev.win netdata-docker.cortexdev.win netdata-backups.cortexdev.win netdata-proxmox.cortexdev.win;
    return 301 https://$host$request_uri;
}

# ------------------------------- Pi-hole -----------------------------------
server {
    listen 443 ssl;
    server_name pihole.cortexdev.win;
    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/pihole-body.conf;
}

# ------------------------------- Proxmox VE --------------------------------
server {
    listen 443 ssl;
    server_name proxmox.cortexdev.win;
    include /etc/nginx/conf.d/snippets/tls-win.conf;
    include /etc/nginx/conf.d/snippets/proxmox-body.conf;
}

