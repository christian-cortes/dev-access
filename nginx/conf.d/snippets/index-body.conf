root /var/www/portal;
index index.html;

# --- Login único de todos los entornos (index.cortexdev.win/login.html) ---
# Página pública (sin auth) que valida credenciales generales en notify y emite
# la cookie firmada con Domain=.cortexdev.win. Copias y UPS redirigen aquí.
location = /login.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# --- SSO: valida la cookie firmada compartida contra el servicio notify ---
location = /_auth {
    internal;
    proxy_pass http://127.0.0.1:8490/api/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
}
# La página pedida se guarda en una cookie temporal (no en la URL); el backend
# la lee y responde a dónde volver tras el login.
location @sso_login {
    # Solo las navegaciones de documento recuerdan el destino. Los subrecursos
    # (favicon, JS, CSS...) devuelven 401 sin tocar la cookie: si no, el favicon
    # que pide el navegador en el login sobrescribía `cortex_sso_next`.
    if ($sso_is_document) {
        add_header Set-Cookie "cortex_sso_next=$scheme://$host$uri; Domain=.cortexdev.win; Path=/; Max-Age=300; Secure; SameSite=Lax";
        return 302 https://index.cortexdev.win/login.html;
    }
    return 401;
}

# --- login/logout/me del servicio notify (público: es el propio login) ---
location /api/auth/ {
    proxy_pass http://127.0.0.1:8490;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Notificaciones (servicio notify en 127.0.0.1:8490). Cada sitio configura
#     las suyas en /notificaciones.html (área "index"). ---
location /api/push/ {
    proxy_pass http://127.0.0.1:8490;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API del portal (catalogo + estado en vivo). Escucha solo en 127.0.0.1:8088.
location /api/ {
    auth_request /_auth;
    error_page 401 = @sso_login;
    proxy_pass http://127.0.0.1:8088;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
}

# Favicon/iconos: públicos (el navegador los pide sin sesión; si dieran 401
# rompen el icono de la pestaña y ensuciaban el destino del login).
location = /favicon.ico {
    access_log off;
    try_files $uri =404;
}
location = /favicon.png {
    access_log off;
    try_files $uri =404;
}
location /favicons/ {
    access_log off;
    try_files $uri =404;
}

location / {
    auth_request /_auth;
    error_page 401 = @sso_login;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

# Service worker de FCM: DEBE servirse público (sin SSO y sin redirecciones);
# un SW con login o con redirect falla el registro (redirect mode = "error").
location = /firebase-messaging-sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# JS/CSS del portal: revalidar siempre (evita app.js/render.js viejos en cache
# que dejarian las tablas sin iconos tras un deploy).
location ~* \.(js|css)$ {
    auth_request /_auth;
    error_page 401 = @sso_login;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
