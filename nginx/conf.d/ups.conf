# Vhost de la UPS para el nginx de la CAPA DE ACCESO (ubuntu-services, .49).
# El DNS (Pi-hole .49) resuelve ups.cortexdev.win -> 192.168.0.49.
# TLS: wildcard publico de Let's Encrypt (tls-win.conf), igual que index.conf.
# El nginx de acceso corre con network_mode: host, por eso el upstream es
# 127.0.0.1 (ups_app publica 127.0.0.1:8484 en el host).

server {
    listen 80;
    server_name ups.cortexdev.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ups.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;

    # --- SSO: valida la cookie firmada compartida contra el servicio notify ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8490/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    # Login único central en el índice (copias ya no tiene login propio).
    location @sso_login {
        add_header Set-Cookie "cortex_sso_next=$scheme://$host$uri; Domain=.cortexdev.win; Path=/; Max-Age=300; Secure; SameSite=Lax";
        return 302 https://index.cortexdev.win/login.html;
    }

    # --- Notificaciones (servicio notify). El área "ups" se configura aquí ---
    location /api/push/ {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Sesión (SSO): el dashboard pide el usuario y cierra la sesión en notify,
    #     que es quien emite/borra la cookie Domain=.cortexdev.win. ---
    location = /api/auth/me {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/logout {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker de FCM: DEBE servirse público (sin SSO y sin redirecciones);
    # un SW con login o con redirect falla el registro (redirect mode = "error").
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check público: lo consulta portal-api (probe del catálogo). Sin SSO,
    # si no devolvería 302 y el monitor marcaría la UPS como caída.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # upsset.cgi (escritura) bloqueado, incluidas variantes con PATH_INFO
    location ~ ^/cgi-bin/nut/upsset\.cgi {
        return 403;
    }

    # NUT clasico (Apache/upsstats.cgi en la PVE .224)
    location /cgi-bin/nut/ {
        auth_request /_auth;
        error_page 401 = @sso_login;
        proxy_pass http://192.168.0.224:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Dashboard propio (mismo origen: /api y /api/ws relativos funcionan igual)
    location / {
        auth_request /_auth;
        error_page 401 = @sso_login;
        proxy_pass http://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/api/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
