# ---------------------------------------------------------------------------
# Portal de administración de copias (copias.cortexdev.win)
#
# Capa de acceso en ubuntu-services: nginx sirve el frontend estático de
# backupcsr/web/static y proxifica /api/ a backupcsr-web (systemd, 127.0.0.1:8089).
# No confundir con backups.cortexdev.win / pbs (Proxmox Backup Server).
#
# El login ya no vive aquí: es único en index.cortexdev.win. La sesión llega por
# la cookie firmada Domain=.cortexdev.win (validada por el backend de copias).
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name copias.cortexdev.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name copias.cortexdev.win;

    include /etc/nginx/conf.d/snippets/tls-win.conf;

    root /var/www/backupcsr;
    index index.html;

    # --- SSO: valida la cookie firmada compartida contra el servicio notify ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8490/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location @sso_login {
        add_header Set-Cookie "cortex_sso_next=$scheme://$host$uri; Domain=.cortexdev.win; Path=/; Max-Age=300; Secure; SameSite=Lax";
        return 302 https://index.cortexdev.win/login.html;
    }

    # Login propio eliminado: cualquier enlace viejo va al login central.
    location = /login.html {
        return 302 https://index.cortexdev.win/login.html;
    }

    # Login/logout central (servicio notify): emite/borra la cookie firmada con
    # Domain=.cortexdev.win. /api/auth/me y /api/auth/password siguen en el
    # backend de copias (validan la misma cookie).
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/logout {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notificaciones (servicio notify). El área "copias" se configura aquí.
    location /api/push/ {
        proxy_pass http://127.0.0.1:8490;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del portal de copias (systemd en 127.0.0.1:8089). El backend valida la
    # cookie y responde 401; el frontend redirige al login central.
    location /api/ {
        proxy_pass http://127.0.0.1:8089;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @sso_login;
        try_files $uri $uri/ =404;
    }

    # Service worker de FCM: DEBE servirse público (sin SSO y sin redirecciones);
    # un SW con login o con redirect falla el registro (redirect mode = "error").
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Frontend sin caché agresiva: evita UI vieja tras un deploy.
    location ~* \.(js|css)$ {
        auth_request /_auth;
        error_page 401 = @sso_login;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
