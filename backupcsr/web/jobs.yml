# Catálogo de jobs del portal de copias (fuente de verdad de la metadata).
#
# La ficha y el horario de aquí son el valor POR DEFECTO: al insertar un job nuevo en
# la tabla `jobs` se copian; las ediciones posteriores (horario, enabled y los campos
# de la ficha: nombre, descripción, origen, destino, lockfile, orden, criticidad,
# responsable, retención, etiquetas, exclusiones y notas) se conservan en la BD, que
# manda tras el alta (catalog.py no las pisa). Los campos nuevos de la ficha se siembran
# del YAML solo si están vacíos, para instalaciones que vienen de un esquema anterior.
# Quitar un job de este archivo lo desactiva (`enabled=0`) pero no borra su histórico.
#
# Este archivo NO ejecuta nada: los jobs reales viven en /opt/backupcsr/jobs/*.sh y
# el horario efectivo está en /etc/cron.d/backupcsr (generado desde la BD cuando
# BACKUP_MANAGE_CRON=1).
#
# Los minutos van escalonados (2, 14, 20, 26, 38, 50) para que los seis jobs no
# arranquen a la vez: seis mirrors simultáneos contra el NAS agotan la RAM del
# anfitrión (4 vCPU, ~3,3 GB, swap lleno) y bloquean el resto de servicios. Los
# *-web corren en horas fuera de la ráfaga horaria (3,10,16,20) para reducir la
# contención de la cola global. Con el planificador encendido (BACKUP_SCHEDULER=1) las
# rondas que no caben esperan en la cola (sin OMITIDO); solo en el respaldo serial, si no
# consiguen turno en GATE_WAIT, la ronda queda OMITIDA (aviso, no fallo) y se reintenta en
# el siguiente ciclo. Con BACKUP_MANAGE_CRON=1 hay que ajustar además el horario en la tabla
# `jobs` (panel de Programación); el planificador (o el gate serial) protege en cualquier caso.
settings:
  timezone: America/Bogota
  grace_minutes: 90
  default_enabled: true

jobs:
  - slug: google-bd
    name: Google BD
    description: Copias automáticas de la BD en el VPS Google (SFTP con llave).
    origin_type: sftp
    # Agrupador del cupo por host del planificador: los jobs con el mismo valor no
    # corren a la vez (evita abrir varias sesiones al mismo servidor remoto).
    origin_host: google
    source: /var/www/html/backupsAutomaticos
    dest_rel: google/backupsAutomaticos
    lockfile: /run/lock/backupcsr-google-bd.lock
    cron:
      minute: "2"
      hour: "6-19"
    sort: 10

  - slug: latino-bd
    name: Latino BD
    description: Copias automáticas de Chequeos/Latino (SFTP con llave, puerto 2200).
    origin_type: sftp
    origin_host: latino
    source: /home/chequeos/taskManager/backupsAutomaticos
    dest_rel: latino/backupsAutomaticos
    lockfile: /run/lock/backupcsr-latino-bd.lock
    cron:
      minute: "14"
      hour: "6-19"
    sort: 20

  - slug: ruta56-bd
    name: Ruta56 BD
    description: Base de datos de Ruta56 (FTP). Excluye storage para no pisar ruta56-web.
    origin_type: ftp
    origin_host: ruta56
    source: taskManager/ruta56
    dest_rel: ruta56
    lockfile: /run/lock/backupcsr-ruta56-bd.lock
    # ruta56-web escribe en ruta56/storage/app, que vive dentro de `ruta56`.
    # Se excluye `storage` al medir este job para que el total no cuente dos veces.
    size_exclude:
      - storage
    cron:
      minute: "26"
      hour: "6-19"
    sort: 30

  - slug: ruta56-web
    name: Ruta56 Web
    description: Archivos de storage de Ruta56 (FTP); comparte árbol con ruta56-bd.
    origin_type: ftp
    origin_host: ruta56
    source: ruta56/storage
    dest_rel: ruta56/storage/app
    lockfile: /run/lock/backupcsr-ruta56-web.lock
    cron:
      minute: "20"
      hour: "3,10,16,20"
    sort: 40

  - slug: latino-web
    name: Latino Web
    description: "Archivos web de Chequeos/Latino (SFTP con la llave latino): educacion y daruma302.socimedicostools.info -> NAS."
    origin_type: sftp
    origin_host: latino
    source: /home/chequeos/educacion + /home/chequeos/daruma302.socimedicostools.info
    dest_rel: latino-web
    lockfile: /run/lock/backupcsr-latino-web.lock
    cron:
      minute: "8"
      hour: "3,10,16,20"
    sort: 45

  - slug: gastro-bd
    name: Gastro BD
    description: Base de datos de Gastro (FTP).
    origin_type: ftp
    origin_host: gastro
    source: taskManager/gastro
    dest_rel: gastro
    lockfile: /run/lock/backupcsr-gastro-bd.lock
    cron:
      minute: "38"
      hour: "6-19"
    sort: 50

  - slug: enter-bd
    name: Enter BD
    description: Base de datos de Enter/Pedidos (FTP).
    origin_type: ftp
    origin_host: enter
    source: taskManager/pedidos
    dest_rel: pedidos
    lockfile: /run/lock/backupcsr-enter-bd.lock
    cron:
      minute: "50"
      hour: "6-19"
    sort: 60

  # --- Tareas deshabilitadas --------------------------------------------------
  # Quedaron fuera de la migración (OneDrive vetado / Ticware no debe llenar el
  # NAS) y se registran aquí, deshabilitadas, para no perderlas de vista. No
  # entran al cron, ni al validador, ni se miden en el panel. google-web ya tiene
  # script corregido en /opt/backupcsr/jobs, pero sigue deshabilitado; ticware-*
  # todavía no tienen script. Para habilitarlas hay que ajustar origen/destino y
  # revisar el horario (ver README, "Tareas deshabilitadas").

  - slug: google-web
    name: Google Web (historias clínicas)
    description: Copia del sitio de historias clínicas del VPS Google (SFTP con la llave google). Se dejó fuera por publicar a OneDrive; el script ya espeja a /mnt/nas/google-web y sigue deshabilitado.
    origin_type: sftp
    origin_host: google
    source: /var/www/html/centro-apoyo/assets + /var/www/html/sapg/assets + /var/www/html/historiasclinicas/files
    dest_rel: google-web
    lockfile: /run/lock/backupcsr-google-web.lock
    enabled: false
    sort: 90

  - slug: ticware-bd
    name: Ticware BD
    description: Base de datos de Ticware (FTP). Se dejó fuera porque Ticware no debe llenar el NAS; falta el script y confirmar origen y destino.
    origin_type: ftp
    origin_host: ticware
    lockfile: /run/lock/backupcsr-ticware-bd.lock
    enabled: false
    sort: 92

  - slug: ticware-web
    name: Ticware Web
    description: Archivos web de Ticware (FTP). Se dejó fuera porque Ticware no debe llenar el NAS; falta el script y confirmar origen y destino.
    origin_type: ftp
    origin_host: ticware
    lockfile: /run/lock/backupcsr-ticware-web.lock
    enabled: false
    sort: 93
