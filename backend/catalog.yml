# Catálogo del portal CortexDev (fuente de verdad).
# Al arrancar, portal-api lo sincroniza (upsert por slug) con SQLite.
# Añadir/editar un servicio = editar este archivo + scripts/deploy.sh.
settings:
  poll_interval_seconds: 30
  probe_timeout_seconds: 5
  retention_days: 7
  default_method: GET
  default_accept: [200, 301, 302, 303, 307, 308, 401, 403]

categories:
  - slug: infraestructura
    title: Infraestructura
    description: Portainer, Proxmox VE, Proxmox Backup Server, Pi-hole, Uptime Kuma, Grafana, Netdata (uno por servidor) y el monitor UPS (APC).
    url: /infraestructura.html
    note_header: Destino
    count_label: servicios
    card_tech: [server, portainer, proxmox]
  - slug: laravel
    title: Laravel
    description: Aplicaciones PHP 8.3 servidas por <code>laravel_web</code> (FPM).
    url: /laravel.html
    note_header: Nota
    count_label: proyectos
    card_tech: [laravel]
  - slug: codeigniter
    title: CodeIgniter / PHP
    description: Apps PHP 8.1 bajo <code>apps.cortexdev.win/&lt;ruta&gt;</code> y <code>csr-twofa</code>.
    url: /codeigniter.html
    note_header: Nota
    count_label: apps
    card_tech: [codeigniter, php]
  - slug: spas
    title: SPAs y utilidades
    description: Portal Pacientes (Angular), Centro de Apoyo (React) y Bot Gomedisys.
    url: /spas.html
    note_header: Nota
    count_label: apps
    card_tech: [angular, react, python]
  - slug: accesos-directos
    title: Accesos directos
    description: Enlaces directos a phpMyAdmin y al portal de copias.
    url: /index.html
    note_header: Destino
    count_label: accesos
    card_tech: [server]

